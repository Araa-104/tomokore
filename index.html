<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>寮観察アプリ（トモコレ風）</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>寮観察アプリ（トモコレ風）</h1>
      <p id="timeLabel"></p>
    </header>

    <nav class="tab-nav">
      <button data-screen="map" class="active">寮マップ</button>
      <button data-screen="characters">キャラ一覧</button>
      <button data-screen="create">キャラ作成</button>
      <button data-screen="settings">設定</button>
    </nav>

    <main>
      <section id="screen-map" class="screen active">
        <h2>寮マップ</h2>
        <p id="vibeLabel" class="subtext"></p>
        <div id="eventSummary" class="event-summary"></div>
        <div id="mapGrid" class="map-grid"></div>
      </section>

      <section id="screen-characters" class="screen">
        <h2>キャラ一覧</h2>
        <div id="characterList" class="card-list"></div>
      </section>

      <section id="screen-create" class="screen">
        <h2>キャラ作成</h2>
        <form id="createForm" class="stack">
          <label>名前<input required name="name" /></label>
          <label>表示名<input name="displayName" /></label>

          <fieldset>
            <legend>性格（0-100）</legend>
            <label>社交性<input type="number" name="sociability" min="0" max="100" value="60" /></label>
            <label>優しさ<input type="number" name="kindness" min="0" max="100" value="65" /></label>
            <label>繊細さ<input type="number" name="sensitivity" min="0" max="100" value="50" /></label>
            <label>頑固さ<input type="number" name="stubbornness" min="0" max="100" value="40" /></label>
          </fieldset>

          <fieldset>
            <legend>見た目（簡易）</legend>
            <label>髪型
              <select name="hair">
                <option value="short1">short1</option>
                <option value="bob1">bob1</option>
                <option value="long1">long1</option>
              </select>
            </label>
            <label>髪色<input type="color" name="hairColor" value="#333333" /></label>
            <label>目
              <select name="eyes">
                <option value="round2">round2</option>
                <option value="line1">line1</option>
                <option value="sharp1">sharp1</option>
              </select>
            </label>
            <label>口
              <select name="mouth">
                <option value="smile1">smile1</option>
                <option value="flat1">flat1</option>
                <option value="open1">open1</option>
              </select>
            </label>
            <label>輪郭
              <select name="face">
                <option value="round">round</option>
                <option value="oval">oval</option>
              </select>
            </label>
            <label>肌色<input type="color" name="skinColor" value="#f1c7a2" /></label>
            <label>服の色<input type="color" name="clothesColor" value="#88aaff" /></label>
          </fieldset>

          <button type="submit">保存する</button>
        </form>
      </section>

      <section id="screen-settings" class="screen">
        <h2>設定</h2>
        <div class="stack">
          <button id="runSimulation">自動行動を1時間進める</button>
          <button id="clearData" class="danger">データ初期化</button>
          <small>保存先: この端末のLocalStorage</small>
        </div>
      </section>

      <section id="screen-detail" class="screen">
        <button id="backToList">← 戻る</button>
        <h2>キャラ個別</h2>
        <div id="detailPanel"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
